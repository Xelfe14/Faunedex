# Builds and tests on GitHub's macOS runners, so every push is checked with the
# toolchain App Store Connect requires (Xcode 26 / the iOS 26 SDK, mandatory
# for uploads since 28 April 2026) without needing a Mac at hand. Free for a
# public repository.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  core:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test --package-path Core

  app:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate

      # Release for a device is what Product > Archive compiles, so this is the
      # build that has to succeed before anything can reach TestFlight. Signing
      # is left out: it needs the Apple Developer account, not the code.
      - name: Build Release for iPhone
        run: |
          xcodebuild build \
            -project Flaunedex.xcodeproj \
            -scheme Flaunedex \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Check what App Store Connect will validate
        run: |
          APP=build/Build/Products/Release-iphoneos/Flaunedex.app
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "SDK:            $(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist")"
          echo "Device family:  $(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist" | tr -d '\n ')"
          echo "Background:     $(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | tr -d '\n ')"
          /usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist" | grep -q '^iphoneos2[6-9]'

      # Debug for the simulator compiles what Release leaves out: the sample
      # data and the screen-preview launch arguments.
      - name: Build Debug for the simulator
        run: |
          xcodebuild build \
            -project Flaunedex.xcodeproj \
            -scheme Flaunedex \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

# Builds and tests on GitHub's macOS runners, so every push is checked with the
# toolchain App Store Connect requires (Xcode 26 / the iOS 26 SDK, mandatory
# for uploads since 28 April 2026) without needing a Mac at hand. Free for a
# public repository.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  core:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test --package-path Core

  # The Mac the app is installed from runs macOS 15 with Xcode 16.4, and an
  # install from Xcode never meets App Store Connect's Xcode 26 rule. This
  # compiles exactly what pressing Run there compiles: Debug, for an iPhone.
  app-xcode16:
    name: iOS app (Xcode 16.4)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build Debug for iPhone
        run: |
          xcodebuild build \
            -project Flaunedex.xcodeproj \
            -scheme Flaunedex \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  app:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate

      # Release for a device is what Product > Archive compiles, so this is the
      # build that has to succeed before anything can reach TestFlight. Signing
      # is left out: it needs the Apple Developer account, not the code.
      - name: Build Release for iPhone
        run: |
          xcodebuild build \
            -project Flaunedex.xcodeproj \
            -scheme Flaunedex \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Check what App Store Connect will validate
        run: |
          APP=build/Build/Products/Release-iphoneos/Flaunedex.app
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "SDK:            $(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist")"
          echo "Device family:  $(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist" | tr -d '\n ')"
          echo "Background:     $(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | tr -d '\n ')"
          /usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist" | grep -q '^iphoneos2[6-9]'

      # Debug for the simulator compiles what Release leaves out: the sample
      # data and the screen-preview launch arguments.
      - name: Build Debug for the simulator
        run: |
          xcodebuild build \
            -project Flaunedex.xcodeproj \
            -scheme Flaunedex \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Launch the Debug build on the sample data and photograph a few screens,
      # so a change to the UI can be looked at without a Mac. Never fails the
      # build: a slow simulator is not a code problem.
      - name: Screenshots
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), reverse=True)
          phones = [d for r in ios for d in runtimes[r] if d["name"].startswith("iPhone")]
          print(next((d["udid"] for d in phones if d["name"] in ("iPhone 17", "iPhone 16")), phones[0]["udid"]))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Flaunedex.app
          mkdir -p screenshots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.taddeocarpinelli.flaunedex 2>/dev/null || true
            xcrun simctl launch "$UDID" com.taddeocarpinelli.flaunedex -seedSampleData "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shoot 1-saisons -previewScreen saisons
          shoot 2-produit -previewScreen produit
          shoot 3-impact -previewScreen impact
          shoot 4-recette -previewRecipeDetail
          shoot 5-demander -previewScreen demander

      - name: Keep the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14

# XcodeGen project definition.
# Regenerate the .xcodeproj after any change with:  xcodegen generate
name: Flaunedex
options:
  bundleIdPrefix: com.taddeocarpinelli
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  FlaunedexCore:
    path: Core

targets:
  Flaunedex:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Flaunedex.entitlements"
    dependencies:
      - package: FlaunedexCore
    # The signing team comes from Config/Team.xcconfig, kept out of git, so it
    # survives regeneration. See Config/Signing.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taddeocarpinelli.flaunedex
        # iPhone only. XcodeGen otherwise defaults to iPhone + iPad, which makes
        # App Store Connect demand iPad screenshots and App Review test a
        # portrait-locked camera app on an iPad. It still installs on iPads.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Flaunedex.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: fr

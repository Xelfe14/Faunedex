# XcodeGen project definition.
# Regenerate the .xcodeproj after any change with:  xcodegen generate
name: Flaunedex
options:
  bundleIdPrefix: com.taddeocarpinelli
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer Team ID here (Xcode → Settings → Accounts), or
    # select it in the Signing & Capabilities tab after generating the project.
    DEVELOPMENT_TEAM: ""

packages:
  FlaunedexCore:
    path: Core

targets:
  Flaunedex:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Flaunedex.entitlements"
    dependencies:
      - package: FlaunedexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taddeocarpinelli.flaunedex
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Flaunedex.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_LANGUAGE: fr
